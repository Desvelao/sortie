# One release for both apps. A tag vX.Y.Z (or vX.Y.Z-rc.N / -beta.N / -alpha.N) builds the desktop tarball and the signed
# Android APK/AAB, then publishes a single GitHub Release with both. Without a tag (manual run) it only builds and
# uploads the artifacts.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      base: ${{ steps.version.outputs.base }}
      plain: ${{ steps.version.outputs.plain }}
      name: ${{ steps.version.outputs.name }}
      file_name: ${{ steps.version.outputs.file_name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          base=$(tr -d '[:space:]' < VERSION)
          is_release=false
          prerelease=false
          plain="$base"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            re='^v([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.[0-9]+)?$'
            if [[ ! "$tag" =~ $re ]]; then
              echo "::error::Tag '$tag' must look like v1.2.3, v1.2.3-rc.1, v1.2.3-beta.1 or v1.2.3-alpha.1"
              exit 1
            fi
            # The tag (without a pre-release suffix) must equal the shared VERSION; both changelogs must cover it.
            scripts/check-version.sh "v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            is_release=true
            [[ -n "${BASH_REMATCH[4]}" ]] && prerelease=true
            plain="${tag#v}"
            name="${plain}+${sha}"
            code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            scripts/check-version.sh
            name="${base}-dev+${sha}"
            code="${GITHUB_RUN_NUMBER}"
          fi
          {
            echo "is_release=$is_release"
            echo "prerelease=$prerelease"
            echo "base=$base"
            echo "plain=$plain"
            echo "name=$name"
            echo "file_name=${name//+/-}"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          echo "Version name: $name, version code: $code"

  desktop:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C desktop image
      # full release checks: reproducible build, license audit, self-test (docs/RELEASE.md)
      - run: make -C desktop release
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            desktop/release/sortie-*-linux-amd64.tar.gz
            desktop/release/sortie-*-linux-amd64.tar.gz.sha256
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and lint
        run: make -C android check RUN=

      - name: Release lint and shrinking
        run: make -C android check-release RUN=

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set (see android/README.md, Releases)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ needs.version.outputs.name }}
          APP_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: make -C android release RUN=

      - name: Collect artifacts
        env:
          FILE_NAME: ${{ needs.version.outputs.file_name }}
          APP_SLUG: ${{ github.event.repository.name }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${APP_SLUG}-${FILE_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/${APP_SLUG}-${FILE_NAME}.aab"
          cp android/app/build/outputs/mapping/release/mapping.txt "dist/${APP_SLUG}-${FILE_NAME}-mapping.txt"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  publish:
    # tag builds only, and only when both apps built
    if: needs.version.outputs.is_release == 'true'
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          # Checksums of every file, published as an asset so downloads can be verified (README, Download).
          cd dist && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from both changelogs
        env:
          BASE: ${{ needs.version.outputs.base }}
          PLAIN: ${{ needs.version.outputs.plain }}
        run: |
          set -euo pipefail
          section() { # $1 = app dir; prints the body of its [PLAIN] or [BASE] section
            local h="$BASE"
            for c in "$PLAIN" "$BASE"; do
              if grep -qE "^## \[${c//./\\.}\]" "$1/CHANGELOG.md"; then h="$c"; break; fi
            done
            awk -v h="## [${h}]" '
              index($0, h) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]: / { exit }
              found { print }
            ' "$1/CHANGELOG.md"
          }
          desktop=$(section desktop)
          android=$(section android)
          if ! grep -q '[^[:space:]]' <<< "$desktop$android"; then
            echo "::error::Both CHANGELOG sections for $PLAIN are empty"
            exit 1
          fi
          {
            echo "## Desktop (Linux)"
            grep -q '[^[:space:]]' <<< "$desktop" && echo "$desktop" || echo "No changes."
            echo
            echo "## Android"
            grep -q '[^[:space:]]' <<< "$android" && echo "$android" || echo "No changes."
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: dist/*
