# Documents grouped by client (taken from the folder they sit in) and year:
#   Acme/2021/Invoices/INV-0042.pdf
#
# Input layout:  clients/<client>/...   e.g. clients/Acme/scans/INV-0042.pdf
version: 1
name: Client documents
input_directory: ~/Documents/inbox
recursive: true
destination_root: ~/Documents/Filed
destination_template: "{client}/{year}/{tag}/{filename}"
conflict_policy: rename          # keep both when a different file already exists

variables:
  - name: client
    sources:
      - kind: manual
      - kind: path               # first folder below the input directory
        pattern: '^clients/([^/]+)'
        group: 1
    fallback: unassigned
  - name: year
    sources:
      - kind: manual
      - kind: filename
        pattern: '(^|[^0-9])(20[0-9]{2})([^0-9]|$)'
        group: 2
      - kind: metadata           # PDF creation date
        field: year
      - kind: mtime
        format: "2006"

tags:
  - {name: Invoices, shortcut: "1"}
  - {name: Contracts, shortcut: "2"}
  - {name: Correspondence, shortcut: "3"}
  # Tax papers also go to one folder per year, whatever the client.
  - name: Tax
    shortcut: "4"
    destination_template: "Tax/{year}/{client}/{filename}"
