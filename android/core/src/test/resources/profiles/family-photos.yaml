# Family photos sorted by year: 2019/Family/IMG_0001.jpg
#
# Copy this file into ~/.config/sortie/profiles/ (or use Profiles ▾ →
# Import profile file…) and adjust the two paths below.
version: 1
name: Family photos
description: Sort photos and videos into year/tag folders.
input_directory: ~/Pictures/inbox
recursive: true
destination_root: ~/Pictures/Sorted
destination_template: "{year}/{tag}/{filename}"

variables:
  # The year of a file. The first source that yields a valid value wins.
  - name: year
    sources:
      - kind: manual            # typed with Ctrl+Y, always wins
      - kind: filename          # IMG_2019..., 2019-05-17 trip.jpg
        pattern: '(^|[^0-9])(20[0-9]{2})([^0-9]|$)'
        group: 2
      - kind: metadata          # EXIF capture date, video creation date...
        field: year
      - kind: mtime             # last resort: when the file was last modified
        format: "2006"
    validate:
      min: 1990
      max: 2100

tags:
  - {name: Family, shortcut: "1"}
  - {name: Holidays, shortcut: "2"}
  - {name: Events, shortcut: "3"}
  - {name: Archive, shortcut: "9"}
